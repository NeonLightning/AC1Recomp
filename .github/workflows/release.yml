# Release builds for Armored Core Recomp: the launcher plus Armored Core,
# Project Phantasma and Master of Arena. Windows ships as a .zip and Linux as a
# .tar.gz (scripts/package_release.sh).
#
# WHAT THIS SHIPS. Compiled games. Each title COMMITS its generated game C
# under games/<id>/generated/ (psxrecomp_cli.py generate, run once from a legal
# disc); the framework COMMITS its OpenBIOS backend in psxrecomp/generated/.
# CI links them into the runtimes and packages the executables with their
# runtime data. Nothing is generated or compiled on a player's machine, and no
# emitters, sources or CLI ship.
#
# WHAT NEVER SHIPS. Disc images and BIOS dumps (only the OpenBIOS image is
# bundled), memory cards, and any machine's settings.
#
# workflow_dispatch: leave version empty to auto-bump patch (or choose bump).

name: Release builds

on:
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Release version (e.g. 0.1.0 or v0.1.0). Leave empty to auto-bump
          from the latest vX.Y.Z git tag (see bump).
        required: false
        type: string
        default: ''
      bump:
        description: 'When version is empty, which semver component to increment'
        required: false
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch
      publish:
        description: 'Create git tag vX.Y.Z and GitHub Release'
        required: true
        type: boolean
        default: true
  push:
    tags:
      - 'v*'

concurrency:
  group: armored-core-release-${{ github.event_name }}-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  CMAKE_BUILD_TYPE: Release

jobs:
  prepare:
    name: Resolve version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      publish: ${{ steps.meta.outputs.publish }}
    steps:
      - name: Checkout (tags for auto-bump)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize version / tag
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            RAW="${{ github.event.inputs.version }}"
            BUMP="${{ github.event.inputs.bump || 'patch' }}"
            PUBLISH="${{ github.event.inputs.publish }}"
          else
            RAW="${{ github.ref_name }}"
            BUMP="patch"
            PUBLISH="true"
          fi
          RAW="$(printf '%s' "${RAW}" | tr -d '[:space:]')"
          if [[ -z "${RAW}" ]]; then
            LATEST="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1 || true)"
            BASE="${LATEST#v}"
            if [[ -z "${BASE}" && -f VERSION ]]; then
              BASE="$(tr -d '[:space:]' <VERSION)"
              BASE="${BASE#v}"
            fi
            BASE="${BASE:-0.0.0}"
            BASE="${BASE%%[-+]*}"
            IFS=. read -r MA MI PA <<<"${BASE}"
            MA="${MA:-0}"; MI="${MI:-0}"; PA="${PA:-0}"
            case "${BUMP}" in
              major) MA=$((MA + 1)); MI=0; PA=0 ;;
              minor) MI=$((MI + 1)); PA=0 ;;
              *) PA=$((PA + 1)) ;;
            esac
            VER="${MA}.${MI}.${PA}"
            TAG="v${VER}"
            echo "Auto-bumped ${BUMP}: ${LATEST:-none} -> ${VER}"
          else
            VER="${RAW#v}"
            if [[ ! "${VER}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.+-][A-Za-z0-9.+-]*)?$ ]]; then
              echo "::error::invalid version '${RAW}' (want X.Y.Z or vX.Y.Z)"
              exit 1
            fi
            TAG="v${VER}"
          fi
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]] && \
             git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error::tag ${TAG} already exists - bump again or pass an explicit version"
            exit 1
          fi
          echo "version=${VER}" >>"$GITHUB_OUTPUT"
          echo "tag=${TAG}" >>"$GITHUB_OUTPUT"
          echo "publish=${PUBLISH}" >>"$GITHUB_OUTPUT"
          echo "Using version ${VER} (tag ${TAG}), publish=${PUBLISH}"

  build:
    name: ${{ matrix.artifact }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact: linux-x64
            shell: bash
          - os: windows-2022
            artifact: windows-x64
            shell: 'msys2 {0}'
    defaults:
      run:
        shell: ${{ matrix.shell }}
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Pin VERSION
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "${RELEASE_VERSION}" >VERSION
          echo "VERSION=$(cat VERSION)"

      - name: Record framework revisions
        shell: bash
        run: bash psxrecomp/tools/ci/record_pins.sh

      # The release is built from COMMITTED C. Fail here, at the top, when a
      # title's generated game C is absent or untracked, or when a disc image
      # or BIOS dump is tracked.
      - name: Verify committed game C
        shell: bash
        run: |
          set -euo pipefail
          for id in armored-core project-phantasma master-of-arena; do
            if ! git ls-files "games/${id}/generated/*_dispatch.c" | grep -q .; then
              echo "::error::games/${id}/generated has no committed *_dispatch.c"
              exit 1
            fi
            if ! git ls-files "games/${id}/generated/*_full_*.c" | grep -q .; then
              echo "::error::games/${id}/generated has no committed *_full_*.c"
              exit 1
            fi
            if ! git ls-files "games/${id}/game.toml" | grep -q .; then
              echo "::error::games/${id}/game.toml is not committed"
              exit 1
            fi
          done
          if git ls-files | grep -iE '\.(cue|iso|img|chd|mcd|mcr)$|(^|/)SCPH' | grep -q .; then
            echo "::error::a disc image, memory card or BIOS dump is tracked:"
            git ls-files | grep -iE '\.(cue|iso|img|chd|mcd|mcr)$|(^|/)SCPH'
            exit 1
          fi

      # The framework's committed BIOS backends must carry stamps that match
      # the emitter fingerprint computed HERE.
      - name: Verify BIOS backend stamps
        shell: bash
        run: bash psxrecomp/tools/ci/check_bios_stamps.sh --framework psxrecomp

      - name: Setup MSYS2 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-vulkan-headers
            mingw-w64-x86_64-shaderc
            curl
            zip
            unzip
            rsync
            tar

      - name: Install deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # X11 + xtst required when FetchContent builds SDL3 (XTEST).
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config rsync \
            libgl1-mesa-dev libxtst-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxfixes-dev libxi-dev libxss-dev libxkbcommon-dev \
            libasound2-dev libpulse-dev libudev-dev zip unzip \
            libvulkan-dev glslc

      # Headers + glslc are enough to compile PSX_HAVE_VULKAN (the runtime
      # loads the ICD dynamically via SDL).
      - name: Verify Vulkan build tools
        run: |
          set -euo pipefail
          command -v glslc
          HDR=""
          for candidate in /mingw64/include/vulkan/vulkan.h /usr/include/vulkan/vulkan.h; do
            if [[ -f "${candidate}" ]]; then
              HDR="${candidate}"
              break
            fi
          done
          if [[ -z "${HDR}" ]]; then
            echo "::error::vulkan/vulkan.h not found"
            exit 1
          fi
          echo "Found ${HDR}"

      # SDL3 is fetched and built statically; prefetch it over HTTP/1.1 because
      # CMake's HTTP/2 download from github.com intermittently dies with
      # REFUSED_STREAM.
      - name: Cache SDL3 source
        uses: actions/cache@v4
        with:
          path: .cache/sdl3-src
          key: sdl3-3.4.10-src

      - name: Prefetch SDL3 source
        shell: bash
        run: |
          set -euo pipefail
          OUT=".cache/sdl3-src"
          sdl3_env() {
            local abs="${OUT}"
            if command -v cygpath >/dev/null 2>&1; then
              abs="$(cygpath -m "${OUT}")"
            elif [[ -d "${OUT}" ]]; then
              abs="$(cd "${OUT}" && pwd)"
            fi
            echo "PSX_SDL3_SOURCE_DIR=${abs}" >>"$GITHUB_ENV"
            echo "SDL3 source ready: ${abs}"
          }
          if [[ -f "${OUT}/CMakeLists.txt" ]]; then
            sdl3_env
            echo "SDL3 source cache hit"
            exit 0
          fi
          chmod +x psxrecomp/tools/ci/prefetch_sdl3.sh
          bash psxrecomp/tools/ci/prefetch_sdl3.sh --out-dir "${OUT}"
          sdl3_env

      - name: Setup ccache (Linux)
        if: runner.os == 'Linux'
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: game-${{ matrix.artifact }}
          max-size: 2G

      - name: Configure & build launcher and games
        run: |
          set -euo pipefail
          EXTRA=()
          if [[ "$(uname -s)" == "Linux" ]]; then
            if command -v ccache >/dev/null 2>&1; then
              EXTRA+=("-DCMAKE_C_COMPILER_LAUNCHER=ccache" "-DCMAKE_CXX_COMPILER_LAUNCHER=ccache")
            fi
            if [[ -z "${VULKAN_SDK:-}" && -f /usr/include/vulkan/vulkan.h ]]; then
              export VULKAN_SDK=/usr
            fi
          elif [[ "$(uname -s)" == MINGW* || "$(uname -s)" == MSYS* ]]; then
            if [[ -z "${VULKAN_SDK:-}" && -f /mingw64/include/vulkan/vulkan.h ]]; then
              export VULKAN_SDK=/mingw64
            fi
            unset PSXRECOMP_TOOLCHAIN_DIR TOOLCHAIN_DIR BPE_TOOLCHAIN_DIR RETCOMM_TOOLCHAIN_DIR || true
            unset CMAKE_PREFIX_PATH SDL3_DIR ZLIB_ROOT || true
          fi
          if command -v glslc >/dev/null 2>&1; then
            EXTRA+=("-DGLSLC_EXE=$(command -v glslc)")
          fi
          if [[ -n "${PSX_SDL3_SOURCE_DIR:-}" && -f "${PSX_SDL3_SOURCE_DIR}/CMakeLists.txt" ]]; then
            EXTRA+=("-DFETCHCONTENT_SOURCE_DIR_SDL3=${PSX_SDL3_SOURCE_DIR}")
          fi
          JOBS="$(nproc 2>/dev/null || echo 4)"
          # The committed generated/ C is REQUIRED, so a checkout without it
          # fails configure instead of silently producing a setup host.
          cmake -S . -B build-ci -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DPSXRECOMP_REQUIRE_GAME_C=ON \
            -DPSXRECOMP_BIOS_STALE_FATAL=ON \
            -DPSXRECOMP_FORCE_SETUP_HOST=OFF \
            -DPSXRECOMP_ALLOW_NO_BIOS=OFF \
            -DPSX_SETUP_WIZARD=ON \
            -DPSX_GAME_VERSION="${RELEASE_VERSION}" \
            "${EXTRA[@]}" 2>&1 | tee build-ci-configure.log
          # All three games must take the FULL path, not the setup-host one.
          FULL="$(grep -c 'linking generated game C (full runtime)' build-ci-configure.log || true)"
          if [[ "${FULL}" -lt 3 ]]; then
            echo "::error::expected 3 games linked with generated C, found ${FULL} (see configure log)"
            exit 1
          fi
          if ! grep -qE 'BIOS backends linked: .*OpenBIOS' build-ci-configure.log; then
            echo "::error::CMake did not link the OpenBIOS backend (psxrecomp/generated missing or stale?)"
            exit 1
          fi
          if ! grep -q 'Vulkan backend: headers' build-ci-configure.log; then
            echo "::error::CMake did not enable PSX_HAVE_VULKAN (see configure log)"
            exit 1
          fi
          for define in PSX_HAVE_VULKAN PSX_HAS_GAME_DISPATCH; do
            if ! grep -q "${define}" build-ci/build.ninja; then
              echo "::error::${define} missing from the compile flags"
              exit 1
            fi
          done
          # One target at a time: their shared asset staging races when linked in parallel.
          for target in psx-armored-core psx-project-phantasma psx-master-of-arena psx-launcher; do
            cmake --build build-ci --target "${target}" -j"${JOBS}"
          done
          # Lobby list pin must match RELEASE_VERSION.
          STAMP="$(find build-ci -maxdepth 2 -name psx_game_version.txt -type f | head -n1 || true)"
          if [[ -z "${STAMP}" ]]; then
            echo "::error::missing psx_game_version.txt after build (update psxrecomp submodule)"
            exit 1
          fi
          BUILT="$(tr -d '[:space:]' <"${STAMP}")"
          BUILT="${BUILT#v}"
          if [[ "${BUILT}" != "${RELEASE_VERSION}" ]]; then
            echo "::error::lobby pin stamp ${BUILT} != RELEASE_VERSION ${RELEASE_VERSION} (${STAMP})"
            exit 1
          fi
          echo "lobby pin ok: ${BUILT} (${STAMP})"

      - name: Package (zip for Windows, tar.gz for Linux)
        run: |
          set -euo pipefail
          chmod +x scripts/package_release.sh
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            export PSXRECOMP_RUNTIME_BIN_DIR=/mingw64/bin
          fi
          export RELEASE_VERSION
          scripts/package_release.sh build-ci "${{ matrix.artifact }}"
          ls -la dist/

      - name: Verify archives
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ matrix.artifact }}" == windows* ]]; then
            ARCHIVE=$(ls dist/armored-core-recomp-*-"${{ matrix.artifact }}".zip | head -1)
            echo "checking ${ARCHIVE}"
            LIST="$(unzip -Z1 "${ARCHIVE}" | sed 's#^[^/]*/##' | grep -v '^$')"
            MODS="$(unzip -p "${ARCHIVE}" '*/mods/*/manifest.toml' 2>/dev/null || true)"
          else
            ARCHIVE=$(ls dist/armored-core-recomp-*-"${{ matrix.artifact }}".tar.gz | head -1)
            echo "checking ${ARCHIVE}"
            LIST="$(tar -tzf "${ARCHIVE}" | sed 's#^[^/]*/##' | grep -v '^$')"
            MODS="$(tar -xzOf "${ARCHIVE}" --wildcards '*/mods/*/manifest.toml' 2>/dev/null || true)"
          fi
          EXT=""
          [[ "${{ matrix.artifact }}" == windows* ]] && EXT=".exe"
          # 1. The launcher, all three games, the bundled OpenBIOS and runtime data.
          for must in "ArmoredCoreLauncher${EXT}" "AC1${EXT}" "ArmoredCoreProjectPhantasma${EXT}" \
                      "ArmoredCoreMasterOfArena${EXT}" 'bios/openbios.bin' 'bios/OpenBIOS.LICENSE' \
                      'games/armored-core/game.toml' 'games/project-phantasma/game.toml' \
                      'games/master-of-arena/game.toml' 'psx_game_version.txt' 'assets/fonts/' \
                      'licenses/recomp-ui-LICENSE.txt' 'README.txt' 'mods/bundled/'; do
            if ! grep -q "^${must}" <<<"${LIST}"; then
              echo "::error::release archive lacks ${must}" >&2
              printf '%s\n' "${LIST}" | head -40 >&2
              exit 1
            fi
          done
          if [[ "${{ matrix.artifact }}" == windows* ]]; then
            for must in libgcc_s_seh-1.dll libstdc++-6.dll libwinpthread-1.dll; do
              grep -qx "${must}" <<<"${LIST}" || { echo "::error::Windows archive lacks ${must}" >&2; exit 1; }
            done
          fi
          MANIFESTS=$(grep -c 'mods/bundled/.*/manifest\.toml' <<<"${LIST}" || true)
          echo "mod manifests in archive: ${MANIFESTS}"
          if [[ "${MANIFESTS}" -lt 1 ]]; then
            echo "::error::release archive ships no mod catalog (mods/bundled/*/manifest.toml)" >&2
            exit 1
          fi
          # 2. It is NOT a build kit: no framework tree, no sources, no generated C.
          for never in '^psxrecomp/' '^recomp-ui/' '^psxrecomp_cli.py' '^psxrecomp-game' '^psxrecomp-bios' \
                       '^generated/' '^seeds/' '^CMakeLists.txt' '^codegen_setup\.' '^launcher/' '^src/' \
                       'games/[^/]*/generated/' '\.(c|cpp|h)$'; do
            if grep -qE "${never}" <<<"${LIST}"; then
              echo "::error::release archive contains build-kit content matching ${never}" >&2
              grep -E "${never}" <<<"${LIST}" | head -20 >&2
              exit 1
            fi
          done
          # 3. No BIOS dump, disc, or memory card; the only image is OpenBIOS.
          if grep -iE '(^|/)SCPH|\.(cue|iso|img|chd|mcd|mcr)$' <<<"${LIST}" | grep -q .; then
            echo "::error::release archive contains a BIOS dump, disc, or memory card" >&2
            grep -iE '(^|/)SCPH|\.(cue|iso|img|chd|mcd|mcr)$' <<<"${LIST}" >&2
            exit 1
          fi
          if grep -iE '\.bin$' <<<"${LIST}" | grep -qv '^bios/openbios.bin$'; then
            echo "::error::release archive contains a .bin other than bios/openbios.bin" >&2
            grep -iE '\.bin$' <<<"${LIST}" | grep -v '^bios/openbios.bin$' >&2
            exit 1
          fi
          # 4. Per-machine state never ships.
          for state in 'settings.toml' 'keybinds.ini' 'input.ini' 'config.ini' 'launcher.ini' 'state.toml' 'mods/installed/' 'saves/'; do
            if grep -q "${state}" <<<"${LIST}"; then
              echo "::error::release archive contains per-machine ${state}" >&2
              exit 1
            fi
          done
          if grep -Eq '^[[:space:]]*channel[[:space:]]*=[[:space:]]*"developer"' <<<"${MODS}"; then
            echo "::error::release archive contains developer-channel mod packages" >&2
            exit 1
          fi
          echo "archives verified: launcher + 3 games, bundled OpenBIOS, mod catalog, no kit / dumps / state"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: armored-core-${{ matrix.artifact }}
          path: |
            dist/armored-core-recomp-*-windows-x64.zip
            dist/armored-core-recomp-*-linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 30

  release:
    name: GitHub Release
    needs: [prepare, build]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout (for tagging on workflow_dispatch)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: false

      - name: Flatten archives
        run: |
          set -euo pipefail
          mkdir -p dist
          find artifacts -type f \( -name 'armored-core-recomp-*.zip' -o -name 'armored-core-recomp-*.tar.gz' \) -exec cp -v {} dist/ \;
          ls -la dist/

      - name: Ensure release tag exists
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            git tag -a "${TAG}" -m "Armored Core Recomp ${TAG}"
          fi
          if ! git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            git push origin "refs/tags/${TAG}"
          fi

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: "Armored Core Recomp ${{ needs.prepare.outputs.tag }}"
          files: |
            dist/armored-core-recomp-*.zip
            dist/armored-core-recomp-*.tar.gz
          generate_release_notes: true
          fail_on_unmatched_files: true
          target_commitish: ${{ github.sha }}
